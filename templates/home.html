<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Exam Predictor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial, sans-serif;
        }

        .container-box{
            width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
            margin-top: 40px;
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .btn-custom{
            width: 100%;
            background-color: #007bff;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .btn-custom:hover{
            background-color: #0056b3;
        }

        .prediction-text{
            text-align: center;
            margin-top: 20px;
            font-size: 28px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center">
        <div class="container-box">

            <h1>Student Exam Performance Predictor</h1>

            <form action="{{ url_for('predict_datapoint')}}" method="post">

                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="gender" required>
                        <option selected disabled value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Race or Ethnicity</label>
                    <select class="form-select" name="race_ethnicity" required>
                        <option selected disabled value="">Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Parental Education</label>
                    <select class="form-select" name="parental_level_of_education" required>
                        <option selected disabled value="">Select Education</option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="high school">High School</option>
                        <option value="master's degree">Master's Degree</option>
                        <option value="some college">Some College</option>
                        <option value="some high school">Some High School</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Lunch Type</label>
                    <select class="form-select" name="lunch" required>
                        <option selected disabled value="">Select Lunch Type</option>
                        <option value="free/reduced">Free/Reduced</option>
                        <option value="standard">Standard</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Test Preparation Course</label>
                    <select class="form-select" name="test_preparation_course" required>
                        <option selected disabled value="">Select Course</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Reading Score</label>
                    <input class="form-control" type="number" name="reading_score"
                        placeholder="Enter Reading Score" min="0" max="100" required />
                </div>

                <div class="mb-3">
                    <label class="form-label">Writing Score</label>
                    <input class="form-control" type="number" name="writing_score"
                        placeholder="Enter Writing Score" min="0" max="100" required />
                </div>

                <div class="d-grid">
                    <input class="btn btn-custom" type="submit" value="Predict Maths Score" />
                </div>

            </form>

            {% if results %}
            <div class="prediction-text">
                Predicted Maths Score: {{ results }}
            </div>
            {% endif %}

        </div>
    </div>

</body>
</html>
